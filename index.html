<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Quiz App</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div id="home-screen">
            <h1>Civil Engineering Revision</h1>
            <h2>Select a subject</h2>
            <div class="subject-buttons">
                <button class="subject-btn" data-subject="Ground Engineering">
                    <strong>Ground Engineering</strong>
                </button>
                <button class="subject-btn" data-subject="Analysis of Structures">
                    <strong>Analysis of Determinate & Indeterminate Structures</strong>
                </button>
                <button class="subject-btn" data-subject="Structural Design & Detailing">
                    <strong>Structural Design & Detailing</strong>
                </button>
            </div>
        </div>
        <div id="setup-screen" style="display:none;">
            <h2 id="selected-subject"></h2>
            <label>Number of questions</label>
            <select id="question-count">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="30">30</option>
                <option value="all">All available</option>
            </select>
            <h3>Timer Mode</h3>
            <label><input type="radio" name="timer-mode" value ="revision" checked>Revision</label>
            <br>
            <label><input type="radio" name="timer-mode" value="mock">Mock Exam Mode</label>
            <p id="available-count"></p>
            <h3>Topics</h3>
            <div id="topic-list"></div>
            <button id="start-btn">Start Quiz</button>
            <button id="back-btn">Back</button>
        </div>
        <div class="quiz" style="display:none;">
            <div id="timer">Time left: 15s</div>
            <div id="question-counter"></div>
            <div class="progress-container"><div id="progress-bar"></div></div>
            <h2 id="question">Question goes here</h2>
            <div id="answer-buttons">
                <button class="btn">Answer 1</button>
                <button class="btn">Answer 2</button>
                <button class="btn">Answer 3</button>
                <button class="btn">Answer 4</button>
            </div>
            <div id="fill-blank-container" style="display:none;">
                <input type="text" id="fill-answer" placeholder="Type your answer">
                <button id="submit-fill">Submit</button>
            </div>
            <div id="multiselect-container" style="display:none;"></div>
            <button id="submit-multi" style="display:none">Submit Answer</button>
            <div class="score-buttons">
                <button id="next-btn">Next</button>
                <button id="home-btn" style="display:none;">Return Home</button>
            </div>
            <p id="fill-feedback"></p>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/data.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
